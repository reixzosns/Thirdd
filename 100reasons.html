<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Reasons I Love You</title>
    <style>
        :root { --berry: #9d3152; --rose: #f6a6b8; --cream: #fff8f2; --ink: #54263a; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Georgia, 'Times New Roman', serif; background: #ffe3e5; overflow-x: hidden; }
        body::before, body::after { position: fixed; z-index: -1; color: rgba(157, 49, 82, .13); font-size: 8rem; pointer-events: none; }
        body::before { content: '\2665'; top: 3vh; left: 4vw; transform: rotate(-18deg); }
        body::after { content: '\2665'; right: 4vw; bottom: 2vh; transform: rotate(18deg); }
        .intro { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
        .intro-inner { max-width: 720px; }
        .eyebrow { color: var(--berry); letter-spacing: .18em; text-transform: uppercase; font: 700 .78rem/1.4 Arial, sans-serif; }
        h1 { margin: .7rem 0 1rem; color: var(--berry); font-size: clamp(2.4rem, 7vw, 5.2rem); line-height: .98; }
        .intro p { margin: 0 auto 2rem; font-size: 1.25rem; }
        button { display: block; margin: 0 auto; border: 0; border-radius: 999px; padding: 1rem 2rem; color: white; background: var(--berry); box-shadow: 0 10px 25px rgba(157,49,82,.25); cursor: pointer; font: 700 1rem Arial, sans-serif; transition: transform .2s ease, background .2s ease; }
        button:hover, button:focus-visible { background: #76213d; transform: translateY(-3px) scale(1.03); }
        .reasons-page { display: none; max-width: 1120px; margin: auto; padding: 4rem 1.25rem 5rem; }
        .reasons-page.visible { display: block; animation: appear .7s ease both; }
        .heading { text-align: center; }
        .heading h2 { margin: .5rem 0; color: var(--berry); font-size: clamp(2rem, 5vw, 4rem); }
        .heading p { font-size: 1.15rem; }
        .reasons { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 2.5rem; }
        .reason { min-height: 125px; padding: 1.25rem; border: 1px solid #f2bdc5; border-radius: 14px; background: rgba(255,248,242,.86); box-shadow: 0 8px 18px rgba(157,49,82,.08); }
        .reason strong { display: block; margin-bottom: .55rem; color: var(--berry); font: 700 1.35rem Arial, sans-serif; }
        .reason p { margin: 0; line-height: 1.45; }
        @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <main class="intro" id="intro">
        <div class="intro-inner">
            <div class="eyebrow"></div>
            <h1>You really thought I only had three reasons to love you?</h1>
            <p></p>
            <button id="open-reasons" type="button">Uh, yes?</button>
        </div>
    </main>
    <section class="reasons-page" id="reasons-page" aria-live="polite">

            <h2>100 reasons why I love you</h2>

        <div class="reasons" id="reasons"></div>

        reasons.forEach((reason, index) => { list.insertAdjacentHTML('beforeend', `<article class="reason"><strong>${index + 1}</strong><p>${reason}</p></article>`); });
        document.getElementById('open-reasons').addEventListener('click', async () => {
            try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (error) { /* Fullscreen may be blocked by browser settings. */ }

            document.getElementById('reasons-page').classList.add('visible');

</body>
</html>
